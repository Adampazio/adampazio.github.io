<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dzień Nauczyciela</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            background-image: radial-gradient(rgb(209, 0, 0), darkred)
        }
        .content {
            text-align:center;
            color:aliceblue;
            z-index: 1;
            position:absolute;
        }
        .btn {
            cursor: pointer;
            font-size: 4vw; 
            margin-top: 2vw; 
            border: solid; 
            border-color: rgb(85, 0, 0);
            background-color: darkred; 
            border-radius: 2vw; 
            color: aliceblue; 
            font-family: Arial, Helvetica, sans-serif;
            padding: 2vw;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .btn:hover {
            background-color: rgb(160, 2, 2);
            border-color:rgb(112, 0, 0);
        }
    </style>
</head>
<body>
    <div class="content">
        <div style="font-family: Arial;">
            <h1 style="font-weight: bolder; font-size: 5vw">Dzień Edukacji Narodowej w CKZiU Mrągowo</h1>
            <img src="CKZiU.jpg" style="border: none; border-radius: 5vw; max-width: 80vw; min-width: 60vw">
            <h1 style="font-weight: bolder; font-size: 4vw">Szanowna Pani, Szanowny Panie</h1>
            <h2 style="margin-top: 3vw; font-weight: bolder; font-size: 2.9vw">Dziękujemy za cierpliwość, wyrozumiałość, oraz wysiłek włożony w naszą edukacje</h2>
            <h2 style="margin-top: 2vw; margin-bottom: 5vw; font-weight: bolder; font-size: 2.9vw">Dzięki Pani/Panu każdy dzień w szkolnej ławce staje się łatwiejszy i ciekawszy.</h2>
            <div style="background-color: darkred; border: solid; border-color: rgb(85, 0, 0); height: 13.5vw; border-radius: 3vw">
                <p style="margin-top: 1.5vw; font-weight: bolder; font-size: 2.9vw">„Nauczanie to sztuka pomagania w odkrywaniu”</p>
                <p style="top: 79%; font-weight: bolder; font-size: 2.9vw; left: 70%; position: absolute">-Mark Van Doren</p>
            </div>
            <button onclick="alert('Dziękujemy!')" class="btn">odbierz podziękowanie</button>
        </div>
    </div>
</body>
</html>
